name = "minsal-feedback-api"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
GITHUB_REPO = "Minsal-CL/Minsal-CL.github.io"
# Orígenes que pueden enviar el formulario (producción, GitHub Pages y local).
ALLOWED_ORIGINS = "https://interoperabilidad.minsal.cl,https://minsal-cl.github.io,http://localhost:4000,http://127.0.0.1:4000"

# Máximo 5 envíos por IP cada 60 s.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Secretos (no van en este archivo):
#   wrangler secret put GITHUB_APP_ID
#   wrangler secret put GITHUB_APP_INSTALLATION_ID
#   wrangler secret put GITHUB_APP_PRIVATE_KEY   < app-pkcs8.pem
#   wrangler secret put TURNSTILE_SECRET          (opcional)
