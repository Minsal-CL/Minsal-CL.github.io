# Retroalimentación de la red sobre las Guías de Implementación FHIR.
# El formulario del portal (/comentarios.html) prellena estos campos por URL
# usando su `id`. Si cambias un id o una opción de "tipo", actualiza también
# _data/feedback.yml.
name: "Comentario sobre una Guía de Implementación"
description: "Cuéntanos qué funciona y qué no de una Guía de Implementación FHIR."
title: "[Guía] "
labels: ["feedback-guia"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por ayudarnos a mejorar las Guías de Implementación.
        **Este Issue es público.** No incluyas datos personales ni clínicos de pacientes, credenciales ni tokens.

  - type: input
    id: guia
    attributes:
      label: Guía de Implementación
      description: "Ej.: Receta Electrónica (SNRE), Laboratorio, MPI…"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Versión de la guía
      placeholder: "Ej.: 0.9.6"

  - type: dropdown
    id: tipo
    attributes:
      label: Tipo de comentario
      options:
        - "Funciona bien"
        - "Error en la guía"
        - "Ambigüedad o falta de claridad"
        - "Sugerencia de mejora"
        - "Consulta de implementación"
    validations:
      required: true

  - type: input
    id: seccion
    attributes:
      label: Página, perfil o recurso
      description: "URL de la página de la guía o nombre del perfil / ejemplo / ValueSet."
      placeholder: "https://interoperabilidad.minsal.cl/fhir/ig/snre/0.9.6/StructureDefinition-..."

  - type: textarea
    id: descripcion
    attributes:
      label: Descripción
      description: "Qué funciona o qué no, qué esperabas y qué ocurrió. Si aplica, incluye el mensaje del validador o un fragmento del recurso (sin datos reales)."
    validations:
      required: true

  - type: input
    id: institucion
    attributes:
      label: Institución / equipo (opcional)
      placeholder: "Ej.: Servicio de Salud, establecimiento, proveedor de software"
