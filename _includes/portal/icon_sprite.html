{%- comment -%}Sprite de íconos (_data/icons.yml). Se usa con {% include portal/ico.html name="pill" %}.{%- endcomment -%}
<svg xmlns="http://www.w3.org/2000/svg" class="d-none" aria-hidden="true">
{%- for i in site.data.icons.svg -%}
<symbol id="i-{{ i[0] }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">{{ i[1] }}</symbol>
{%- endfor -%}
</svg>
