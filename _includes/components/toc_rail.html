{%- comment -%}
Índice "En esta página" en el riel derecho. Se construye desde los
h2/h3 del contenido; si hay menos de 2, no se muestra. Resalta la
sección visible al hacer scroll. Sin dependencias.
{%- endcomment -%}
<aside class="toc-rail" hidden aria-labelledby="toc-rail-title">
  <p class="toc-rail__title" id="toc-rail-title">En esta página</p>
  <nav><ol class="toc-rail__list"></ol></nav>
</aside>

<script>
(function () {
  var rail = document.querySelector('.toc-rail');
  var content = document.getElementById('main-content');
  if (!rail || !content) return;

  var headings = [].slice.call(content.querySelectorAll('h2, h3'))
    .filter(function (h) { return h.id && h.offsetParent !== null; });
  if (headings.length < 2) return;

  var list = rail.querySelector('.toc-rail__list');
  headings.forEach(function (h) {
    var li = document.createElement('li');
    li.className = 'toc-rail__item toc-rail__item--' + h.tagName.toLowerCase();
    var a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent.replace(/\s+$/, '');
    li.appendChild(a);
    list.appendChild(li);
  });
  rail.hidden = false;

  var links = {};
  [].slice.call(list.querySelectorAll('a')).forEach(function (a) {
    links[a.getAttribute('href').slice(1)] = a;
  });
  var current;
  var obs = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;
      if (current) current.classList.remove('is-active');
      current = links[e.target.id];
      if (current) current.classList.add('is-active');
    });
  }, { rootMargin: '0px 0px -75% 0px', threshold: 1 });
  headings.forEach(function (h) { obs.observe(h); });
})();
</script>
