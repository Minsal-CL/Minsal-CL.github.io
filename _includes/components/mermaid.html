<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
(function () {
  function initMermaid() {
    if (typeof mermaid === "undefined") return;
    mermaid.initialize({
      startOnLoad: true,
      securityLevel: "strict",
      theme: "base",
      themeVariables: {
        fontFamily: "Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif",
        primaryColor: "#e8f0fb",
        primaryBorderColor: "#0b4ea2",
        primaryTextColor: "#1b1f24",
        lineColor: "#5a6472",
        secondaryColor: "#e3e8ef",
        tertiaryColor: "#ffffff",
        actorBkg: "#e8f0fb",
        actorBorder: "#0b4ea2",
        actorTextColor: "#1b1f24",
        signalColor: "#5a6472",
        signalTextColor: "#1b1f24",
        labelBoxBkgColor: "#e8f0fb",
        labelBoxBorderColor: "#0b4ea2",
        labelTextColor: "#1b1f24",
        noteBkgColor: "#f5f7fa",
        noteBorderColor: "#e3e8ef"
      }
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initMermaid);
  } else {
    initMermaid();
  }
})();
</script>
