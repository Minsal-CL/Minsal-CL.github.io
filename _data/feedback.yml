# Retroalimentación de la red sobre las Guías de Implementación (comentarios.md).
# guides: id = carpeta en fhir/ig/<id>/ (permite detectar la guía desde la URL
#         de origen). label se usa tal cual en el Issue de GitHub.
# types:  id = etiqueta tipo:<id> del Issue.
# Ambas listas deben coincidir con GUIDES / TYPES de feedback-api/src/index.js.

guides:
  - { id: snre,        label: "Receta Electrónica (SNRE)" }
  - { id: tei,         label: "Tiempos de Espera (TEI)" }
  - { id: mpi,         label: "Índice Maestro de Pacientes (MPI)" }
  - { id: hpd,         label: "Directorio de Prestadores (HPD)" }
  - { id: mfr,         label: "Maestro Prestadores Institucionales (MFR)" }
  - { id: nid,         label: "Núcleo de Interoperabilidad de Datos (NID)" }
  - { id: laboratorio, label: "Laboratorio" }
  - { id: terminologia, label: "Servicios Terminológicos" }
  - { id: otra,        label: "Otra / general" }

types:
  - id: funciona
    icon: "✓"
    label: "Funciona bien"
    hint: "La implementamos y funcionó. Cuéntanos qué ayudó."
  - id: error
    icon: "!"
    label: "Error en la guía"
    hint: "Perfil, ejemplo, regla de validación o terminología incorrecta."
  - id: ambiguedad
    icon: "?"
    label: "Ambigüedad o falta de claridad"
    hint: "Algo admite más de una interpretación o falta información."
  - id: sugerencia
    icon: "+"
    label: "Sugerencia de mejora"
    hint: "Un cambio que facilitaría la implementación."
  - id: consulta
    icon: "…"
    label: "Consulta de implementación"
    hint: "Duda concreta al implementar la guía."
