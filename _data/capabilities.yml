# "Qué hacemos" — cuatro capacidades, en lenguaje simple.
# Texto derivado de las páginas actuales de arquitectura y componentes.

- id: conectar
  icon: link
  title: "Conectamos sistemas"
  plain: >-
    Hacemos posible que plataformas y establecimientos distintos se entiendan
    entre sí, para que la información de salud pueda circular de forma segura
    cuando y donde se necesita.
  detail: >-
    Se define una arquitectura orientada a servicios, con un modelo híbrido
    (centralizado y distribuido) que permite la movilidad de la información
    dentro de la red asistencial.

- id: personas
  icon: user
  title: "Ponemos a la persona al centro"
  plain: >-
    La historia clínica acompaña a la persona, no al establecimiento. Un equipo
    tratante en cualquier lugar de Chile puede acceder a la información
    relevante que se generó en otro punto de la red.
  detail: >-
    La identificación unívoca de pacientes y prestadores es la base para
    correlacionar datos de distintas fuentes sin errores.

- id: capacidades
  icon: layers
  title: "Construimos capacidades nacionales"
  plain: >-
    Servicios comunes que todo el sistema de salud puede reutilizar: identidad
    de pacientes, directorio de prestadores y terminologías clínicas.
  detail: >-
    Componentes compartidos que evitan que cada institución resuelva lo mismo
    por separado y que aseguran consistencia a escala nacional.

- id: estandares
  icon: check
  title: "Definimos estándares"
  plain: >-
    Reglas compartidas para registrar y compartir información clínica, basadas
    en estándares internacionales de amplio uso.
  detail: >-
    HL7 FHIR R4 como estándar sintáctico; SNOMED CT, LOINC y CIE para el
    significado clínico; DICOM para imágenes. Un comité técnico revisa y
    actualiza estas definiciones.
