# Contenido de la portada. Todo proviene de páginas ya existentes del sitio;
# aquí sólo se reorganiza y jerarquiza. No agregar información institucional nueva.

hero:
  eyebrow: "Ministerio de Salud de Chile"
  title: "Interoperabilidad para toda la red de salud del país"
  lead: >-
    Marco de acuerdo, estándares y guías de implementación para que la
    información clínica acompañe a cada paciente, dondequiera que se atienda
    en Chile.
  actions:
    - label: "Explorar la arquitectura"
      href: "/docs/especificacion-de-la-arquitectura"
      style: primary
    - label: "Guías de Implementación (FHIR IG)"
      href: "https://interoperabilidad.minsal.cl/fhir/ig"
      style: ghost

intro:
  kicker: "Qué es"
  title: "Una estrategia tecnológica basada en estándares abiertos"
  body: >-
    La interoperabilidad busca la comunicación y el intercambio de información
    entre sistemas y plataformas heterogéneas del sector salud, manteniendo al
    paciente como eje central. Se apoya en un modelo de gobernanza transversal
    y en un modelo híbrido —centralizado y distribuido— para el manejo de los
    activos de información.

sections:
  - kicker: "Especificación"
    title: "Especificación de la Arquitectura"
    intro: "El marco de acuerdo mínimo para el intercambio de información en salud."
    cards:
      - num: "01"
        title: "Arquitectura"
        text: "Modelo híbrido, gobernanza transversal y responsabilidades institucionales."
        href: "/docs/especificacion-de-la-arquitectura/arquitectura.html"
      - num: "02"
        title: "Principios Arquitecturales"
        text: "Once principios rectores: acceso, privacidad, seguridad y neutralidad tecnológica, entre otros."
        href: "/docs/especificacion-de-la-arquitectura/principios-arquitectura.html"
      - num: "03"
        title: "Estándares y Perfiles"
        text: "Estándares sintácticos y semánticos de uso mundial adoptados por el Ministerio."
        href: "/docs/especificacion-de-la-arquitectura/estandares-perfiles.html"

  - kicker: "Componentes"
    title: "Componentes de la Arquitectura"
    intro: "Los servicios base sobre los que se construye la interoperabilidad."
    cards:
      - num: "01"
        title: "Índice Maestro de Pacientes"
        text: "Identificación precisa y coherente de pacientes entre las organizaciones de la red."
        href: "/docs/componentes-de-la-arquitectura/empi.html"
      - num: "02"
        title: "Directorio de Prestadores"
        text: "Maestro nacional de prestadores individuales de salud."
        href: "/docs/componentes-de-la-arquitectura/hpd.html"
      - num: "03"
        title: "Servicios Terminológicos"
        text: "ValueSets, CodeSystems y ConceptMaps FHIR sobre el perfil mSVCM de IHE."
        href: "/docs/componentes-de-la-arquitectura/terminologicos.html"

